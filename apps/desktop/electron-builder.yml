appId: com.ion.desktop
productName: Ion
# Exact version required: electron is hoisted to the monorepo root, so
# electron-builder cannot resolve the ^ range from this workspace.
electronVersion: 43.4.0
directories:
  buildResources: build
  output: release
# Main, preload, and renderer are fully bundled by electron-vite (workspace
# packages included), so node_modules is not needed inside the app.
files:
  - out/**
  - resources/**
  - '!node_modules/**'
asar: true
npmRebuild: false
electronLanguages:
  - en
mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  # electron-builder's own signing is skipped; scripts/eb-after-pack.cjs signs
  # the packed bundle instead — with the "Ion Dev" self-signed cert when
  # present (so macOS TCC permission grants persist across rebuilds and
  # Squirrel.Mac accepts updates) or ad-hoc for local dir builds.
  # (The Apple Development cert is unusable: no provisioning profile.)
  identity: null
  # zip feeds the auto-updater (Squirrel.Mac); dmg is the human download.
  # `npm run package` still builds a plain dir via the --dir flag.
  target:
    - target: zip
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
# Same relative path in both resolution contexts: repo root (npx from here)
# and apps/desktop (npm run -w @ion/desktop). The desktop copy re-exports
# the real hook at scripts/eb-after-pack.cjs.
afterPack: scripts/eb-after-pack.cjs
# Auto-update feed. electron-updater in the packaged app checks the newest
# GitHub Release of this repo (latest-mac.yml + zip); `npm run release`
# uploads there. The repo must exist and be PUBLIC before the first release.
# releaseType: release = users get it immediately (no draft step).
publish:
  provider: github
  owner: deadshot4444-blip
  repo: ion
  releaseType: release
